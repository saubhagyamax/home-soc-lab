# /etc/netplan/50-cloud-init.yaml on the wazuh VM
# ens18 = vmbr0 (home), ens19 = vmbr1 (lab). Check names with `ip a`.
network:
  version: 2
  ethernets:
    ens18:
      addresses: [192.168.1.60/24]
      routes: [{to: default, via: 192.168.1.1}]
      nameservers: {addresses: [1.1.1.1]}
    ens19:
      addresses: [10.10.10.10/24]
